databaseChangeLog:
  - changeSet:
      id: create-book-category-table
      author: tacha
      changes:
        - createTable:
            tableName: books_categories
            columns:
              - column:
                  name: book_id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_books_categories
                    nullable: false
                    references: books(id)
                    foreignKeyName: fk_books_categories_book
              - column:
                  name: category_id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_books_categories
                    nullable: false
                    references: categories(id)
                    foreignKeyName: fk_books_categories_category
