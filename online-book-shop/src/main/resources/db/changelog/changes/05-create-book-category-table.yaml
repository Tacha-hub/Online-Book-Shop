databaseChangeLog:
  - changeSet:
      id: create-book-category-table
      author: tacha
      changes:
        - createTable:
            tableName: book_categories
            columns:
              - column:
                  name: book_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: category_id
                  type: BIGINT
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: book_categories
            columnNames: book_id, category_id
            constraintName: pk_book_category
        - addForeignKeyConstraint:
            baseTableName: book_categories
            baseColumnNames: book_id
            referencedTableName: books
            referencedColumnNames: id
            constraintName: fk_book_category_book
        - addForeignKeyConstraint:
            baseTableName: book_categories
            baseColumnNames: category_id
            referencedTableName: categories
            referencedColumnNames: id
            constraintName: fk_book_category_category
        - createIndex:
            tableName: book_categories
            indexName: idx_book_category_category_id
            columns:
              - column:
                  name: category_id
