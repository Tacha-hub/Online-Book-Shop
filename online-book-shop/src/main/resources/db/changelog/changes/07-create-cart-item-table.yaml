databaseChangeLog:
  - changeSet:
      id: create-cart-item-table
      author: tacha
      changes:
        - createTable:
            tableName: cart_items
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: shopping_cart_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    references: shopping_carts(id)
                    foreignKeyName: fk_cart_items_cart
              - column:
                  name: book_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    references: books(id)
                    foreignKeyName: fk_cart_items_book
              - column:
                  name: quantity
                  type: INT
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: cart_items
            columnNames: shopping_cart_id, book_id
            constraintName: uk_cart_items_cart_book
