databaseChangeLog:
  - changeSet:
      id: update-book-category-constraints
      author: tacha
      changes:
        - createIndex:
            tableName: books_categories
            indexName: idx_book_category_category_id
            columns:
              - column:
                  name: category_id
        - dropForeignKeyConstraint:
            baseTableName: books_categories
            constraintName: fk_books_categories_book
        - addForeignKeyConstraint:
            baseTableName: books_categories
            baseColumnNames: book_id
            referencedTableName: books
            referencedColumnNames: id
            constraintName: fk_book_category_book
        - dropForeignKeyConstraint:
            baseTableName: books_categories
            constraintName: fk_books_categories_category
        - addForeignKeyConstraint:
            baseTableName: books_categories
            baseColumnNames: category_id
            referencedTableName: categories
            referencedColumnNames: id
            constraintName: fk_book_category_category
