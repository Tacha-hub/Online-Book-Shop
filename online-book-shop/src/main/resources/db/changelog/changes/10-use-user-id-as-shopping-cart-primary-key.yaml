databaseChangeLog:
  - changeSet:
      id: use-user-id-as-shopping-cart-primary-key
      author: tacha
      changes:
        - createTable:
            tableName: shopping_carts_maps_id
            columns:
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_shopping_carts_user
                    nullable: false
                    references: users(id)
                    foreignKeyName: fk_shopping_carts_maps_id_user
              - column:
                  name: is_deleted
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
        - sql:
            sql: >-
              INSERT INTO shopping_carts_maps_id (user_id, is_deleted)
              SELECT user_id, is_deleted FROM shopping_carts
        - dropForeignKeyConstraint:
            baseTableName: cart_items
            constraintName: fk_cart_items_cart
        - dropUniqueConstraint:
            tableName: cart_items
            constraintName: uk_cart_items_cart_book
        - sql:
            comment: Preserve item ownership by translating each old cart id to its user id
            sql: >-
              UPDATE cart_items
              SET shopping_cart_id =
              (SELECT user_id FROM shopping_carts
              WHERE shopping_carts.id = cart_items.shopping_cart_id)
        - addUniqueConstraint:
            tableName: cart_items
            columnNames: shopping_cart_id, book_id
            constraintName: uk_cart_items_cart_book
        - dropTable:
            tableName: shopping_carts
        - renameTable:
            oldTableName: shopping_carts_maps_id
            newTableName: shopping_carts
        - addForeignKeyConstraint:
            baseTableName: cart_items
            baseColumnNames: shopping_cart_id
            referencedTableName: shopping_carts
            referencedColumnNames: user_id
            constraintName: fk_cart_items_cart
