databaseChangeLog:
  - changeSet:
      id: add-user-deleted-flag
      author: tacha
      changes:
        - addColumn:
            tableName: users
            columns:
              - column:
                  name: is_deleted
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
  - changeSet:
      id: create-roles-and-user-roles
      author: tacha
      changes:
        - createTable:
            tableName: roles
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true
        - createTable:
            tableName: users_roles
            columns:
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_users_roles
                    references: users(id)
                    foreignKeyName: fk_users_roles_user
              - column:
                  name: role_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_users_roles
                    references: roles(id)
                    foreignKeyName: fk_users_roles_role
        - insert:
            tableName: roles
            columns:
              - column:
                  name: name
                  value: ROLE_USER
        - insert:
            tableName: roles
            columns:
              - column:
                  name: name
                  value: ROLE_ADMIN
  - changeSet:
      id: create-local-admin
      author: tacha
      preConditions:
        - onFail: HALT
        - sqlCheck:
            expectedResult: 0
            sql: SELECT COUNT(*) FROM users WHERE email = 'admin@bookstore.local'
      changes:
        - insert:
            tableName: users
            columns:
              - column:
                  name: email
                  value: admin@bookstore.local
              - column:
                  name: password
                  value: "$2a$10$1IjvVG3DHE1kUFQY18AUcOK4JIccuhwRq4EHXjsqWodOINCvxpq02"
              - column:
                  name: first_name
                  value: Local
              - column:
                  name: last_name
                  value: Admin
        - insert:
            tableName: users_roles
            columns:
              - column:
                  name: user_id
                  valueComputed: "(SELECT id FROM users WHERE email = 'admin@bookstore.local')"
              - column:
                  name: role_id
                  valueComputed: "(SELECT id FROM roles WHERE name = 'ROLE_ADMIN')"
  - changeSet:
      id: assign-user-role-to-existing-users
      author: tacha
      changes:
        - sql:
            sql: >-
              INSERT INTO users_roles (user_id, role_id)
              SELECT u.id, r.id FROM users u CROSS JOIN roles r
              WHERE r.name = 'ROLE_USER'
              AND NOT EXISTS (SELECT 1 FROM users_roles ur
              WHERE ur.user_id = u.id AND ur.role_id = r.id)
